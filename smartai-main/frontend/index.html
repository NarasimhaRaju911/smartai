<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SmartAI - an AI chatbot with OpenAI and Google Gemini" />
    <title>SmartAI</title>
    <script>
      // Apply the saved theme before the page is drawn, so there is no light/dark flash.
      try {
        var t = localStorage.getItem("smartai-theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
